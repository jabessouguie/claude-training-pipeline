# CI ciblée sur le contenu réel de ce dépôt : des specs Markdown (les SKILL.md
# des skills) + un script Python qui génère la grille de cadrage .xlsx.
# Il n'y a rien à builder, containeriser ni déployer.
# Deux garde-fous seulement : compilation du script Python, et détection de secrets.

name: CI

on:
  push:
  pull_request:

jobs:
  # 1. Vérifie que TOUS les scripts des skills compilent et que leur dépendance
  #    (openpyxl) s'importe — filet minimal contre un script cassé poussé par erreur.
  #    Le glob est délibéré : n'énumérer qu'un script laissait les deux autres
  #    (generate_illustrations.py, generate_exigences_xlsx.py) sans aucune
  #    vérification, alors que la CI verte est un prérequis de revue (CONTRIBUTING.md).
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl
      - name: Compiler tous les scripts de skills
        run: |
          shopt -s nullglob
          scripts=(*/scripts/*.py)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "Aucun script trouvé — le glob */scripts/*.py ne correspond plus à l'arborescence." >&2
            exit 1
          fi
          printf 'Scripts compilés :\n'; printf '  %s\n' "${scripts[@]}"
          python -m py_compile "${scripts[@]}"
        shell: bash
      - run: python -c "import openpyxl"

  # 2. Détection de secrets — seul contrôle de sécurité pertinent pour un dépôt
  #    qui ne contient que du texte (éviter qu'un token, une clé ou une URL interne
  #    sensible soit poussé par inadvertance dans un SKILL.md, un README ou la CI).
  secret-detection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
